name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Susun folder
        run: |
          D=app/src/main/java/app/capri/mobile
          R=app/src/main/res
          mkdir -p $D app/src/main/assets/sprites app/src/main $R/xml $R/mipmap-mdpi $R/mipmap-hdpi $R/mipmap-xhdpi $R/mipmap-xxhdpi $R/mipmap-xxxhdpi
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            [ -f $R/mipmap-$density/ic_launcher.png ] || cp ic_launcher.png $R/mipmap-$density/ic_launcher.png
          done
          rm -f ic_launcher.png app-logo.png laydown_sleep.png
          mv capri_access.xml $R/xml/
          mv *.kt $D/
          mv *.png app/src/main/assets/sprites/
          mv AndroidManifest.xml app/src/main/
          mv app-build.gradle.kts app/build.gradle.kts
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.9 }
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: capri-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
