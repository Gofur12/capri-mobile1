name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Susun folder
        run: |
          D=app/src/main/java/app/capri/mobile
          mkdir -p $D app/src/main/assets/sprites app/src/main
          mv *.kt $D/
          mv *.png app/src/main/assets/sprites/
          mv AndroidManifest.xml app/src/main/
          mv app-build.gradle.kts app/build.gradle.kts
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.9 }
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: capri-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
