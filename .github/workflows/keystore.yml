name: Buat Keystore (sekali saja)

on:
  workflow_dispatch:

jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - name: Generate keystore
        run: |
          PASS=$(openssl rand -hex 12)
          keytool -genkeypair -keystore capri.jks -alias capri \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PASS" -keypass "$PASS" \
            -dname "CN=Capri Mobile, O=Capri, C=ID"
          {
            echo "KEY_ALIAS=capri"
            echo "KEYSTORE_PASSWORD=$PASS"
            echo "KEYSTORE_BASE64="
            base64 -w0 capri.jks
            echo
          } > secrets.txt

      - uses: actions/upload-artifact@v4
        with:
          name: keystore-JANGAN-DIBAGIKAN
          path: |
            capri.jks
            secrets.txt
          retention-days: 1
